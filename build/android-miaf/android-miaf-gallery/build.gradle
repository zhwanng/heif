plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def projectDir = getProjectDir().absolutePath
def rootPath = file(projectDir + "/../../../srcs/").path

def gallerySourcePath = file(rootPath + "/android-miaf-gallery/").path
def galleryJavaPath = file(gallerySourcePath + "/java/").path
def galleryResourcePath = file(gallerySourcePath + "/res/").path

android {
    namespace 'com.nokia.miaf.gallery'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters = rootProject.ext.chosenAbiFilters
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main {
        java.srcDirs = [galleryJavaPath]
        res.srcDirs = [galleryResourcePath]
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.4.10'
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.1.22'
    implementation 'com.android.support.constraint:constraint-layout:2.0.1'
    implementation project(':api-java')
    implementation project(':android-utility')
}
