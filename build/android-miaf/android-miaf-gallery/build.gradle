plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

def projectDir = getProjectDir().absolutePath
def rootPath = file(projectDir + "/../../../srcs/").path

def gallerySourcePath = file(rootPath + "/android-miaf-gallery/").path
def galleryJavaPath = file(gallerySourcePath + "/java/").path
def galleryResourcePath = file(gallerySourcePath + "/res/").path

android {
    namespace 'com.nokia.miaf.gallery'
    compileSdk 34

    defaultConfig {

        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters = rootProject.ext.chosenAbiFilters
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets.main {
        java.srcDirs = [galleryJavaPath]
        res.srcDirs = [galleryResourcePath]
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation "androidx.heifwriter:heifwriter:1.1.0"
    implementation 'com.googlecode.mp4parser:isoparser:1.1.22'
    implementation 'com.adobe.xmp:xmpcore:6.1.10'

    implementation project(':api-java')
    implementation project(':android-utility')
}
